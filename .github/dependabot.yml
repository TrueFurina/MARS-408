# Dependabot 配置（MARS-408 / study-help-pro）
#
# 为什么必须有这个文件：
# 本仓库同一份源码存在三份镜像
#   - 根源码（CI 真正跑的那一份）
#   - submission/04_源码/MARS-408_source
#   - deliverables/MARS-408 考研多智能体个性化学习系统/源码
# Dependabot 的依赖图增量扫描只覆盖「它自己在跟踪的目录」；此前未声明 npm 子目录，
# 导致两份归档副本的 package-lock.json 告警自 2026-10-17 起就再没被重新评估过
# （改动已经提交到仓库，但告警面板停留在旧快照）。
#
# 这里显式声明三个 npm 目录，让 Dependabot 定期重新解析它们：
#   - minor / patch 全部合并成一个 PR（避免每周几十条 PR 噪声）
#   - major 单独出 PR，由人判断是否跨大版本（本轮 vitest 3→5、happy-dom 15→21 就是手动处理的）
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/submission/04_源码/MARS-408_source"
      - "/deliverables/MARS-408 考研多智能体个性化学习系统/源码"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # ---------------------------------------------------------------------------
    # ignore：对「版本号 <1.0 的依赖」，Dependabot 会把 minor 字段递增当成 minor/patch，
    # 并顺手改写 package.json 里的 range 字符串 —— 于是 ^0.10.0 的保护形同虚设。
    # PR #28 就是这样把 @wasmer/sdk 0.10.0 → 0.19.1、katex 0.16.10 → 0.19.0 带进来的，
    # 结果 type-check 炸（Wasmer.fromFile / fromRegistry 不再存在）、npm install 直接 ERESOLVE
    # （katex 撞 @sigodenjs/marked-katex-extension@1.0.0 的 peer `katex >=0.16 <0.17`）。
    # 这里按「版本天花板」而不是按 update-types 来拦，避免同类再犯。
    # ---------------------------------------------------------------------------
    ignore:
      - dependency-name: "@wasmer/sdk"
        versions:
          - ">=0.11.0"
      - dependency-name: "katex"
        versions:
          - ">=0.17.0"
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
      - dependency-name: "vue-router"
        versions:
          - ">=5.0.0"
      # marked 15 → 16+：@sigodenjs/marked-katex-extension@1.0.0（当前唯一可用版本）
      # 的 peer 是 `marked >=4 <16`，越界即 ERESOLVE。除非该扩展发布新版，否则不动。
      - dependency-name: "marked"
        versions:
          - ">=16.0.0"
      # eslint / @eslint/js 9 → 10：实测不兼容，暂缓（2026-10-19 复现记录）
      #   eslint 10 下 typescript-eslint 无法再从调用栈推断 tsconfigRootDir，
      #   而本仓库同一份源码有三个 tsconfig 根（根 + submission/ + deliverables/ 镜像），
      #   于是每个 .ts / .vue 都报 Parsing error: "multiple candidate TSConfigRootDirs"。
      #   补 tsconfigRootDir 只能修根源码，两份镜像仍报 198 条解析错误；
      #   typescript-eslint 目前最新就是 8.71.2（无 v9），没有上游修复可用。
      #   等 typescript-eslint 跟到 eslint 10 再一起做。
      - dependency-name: "eslint"
        versions:
          - ">=10.0.0"
      - dependency-name: "@eslint/js"
        versions:
          - ">=10.0.0"
    groups:
      npm-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
