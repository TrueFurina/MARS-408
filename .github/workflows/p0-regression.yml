name: P0 Regression Gate (wave-1)

# wave-1 回归门禁：P0 用例最先跑且不可失败；其余分档并行。
# 设计要点（源自测试计划 / testing-expert）：
#  - pyproject addopts 默认排除 system/requires_milvus/slow；各分档用自身 -m 覆盖。
#  - Windows 仅跑默认集（不触真实向量/模型原生库）；segv_env 已在 win32 自动 skip。
#  - per-file 覆盖率门禁由 scripts/check_coverage_thresholds.py 在 fast-unit(ubuntu) 执行。

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"   # nightly: 触发 slow 档

concurrency:
  group: p0-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ── 门禁：最先跑、不可失败（continue-on-error: false） ──
  p0-regression-gate:
    name: P0 Regression Gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (.[test])
        working-directory: py-server
        run: pip install -e ".[test]"
      - name: Run P0 regression
        # 覆盖 pyproject addopts 的 -m 过滤，仅跑 p0_regression（P0 集不应含 system/milvus/slow）
        working-directory: py-server
        run: pytest -m p0_regression --timeout=120 -q
        continue-on-error: false

  # ── 快速单测：Win+Linux 矩阵 + 总体覆盖率 + per-file 门禁 ──
  fast-unit:
    name: Fast Unit (${{ matrix.os }})
    needs: p0-regression-gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (.[test])
        working-directory: py-server
        run: pip install -e ".[test]"
      - name: Fast unit + coverage
        # 不指定 -m，沿用 addopts：排除 system/requires_milvus/slow
        working-directory: py-server
        run: pytest --cov=. --cov-report=json:coverage.json --cov-fail-under=50 -q
      - name: Per-file coverage gate
        if: matrix.os == 'ubuntu-latest'
        working-directory: py-server
        run: python scripts/check_coverage_thresholds.py
      - name: Upload coverage json
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: py-server/coverage.json

  # ── 系统测试：subprocess 起真实 uvicorn ──
  system:
    name: System (Linux, real uvicorn)
    needs: p0-regression-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 注意：本 job 不再在 job 级设 AUTH_SECRET。系统测试（test_concurrent_writes.py /
    # test_p0_f6_regression.py）会显式把自己签发 token 所用的 AUTH_SECRET 注入 uvicorn
    # 子进程环境（uvicorn --env-file 默认不覆盖已存在的 os.environ，job 级 AUTH_SECRET
    # 会泄漏进子进程并造成 token 校验 401 → KeyError 的伪绿/顺序依赖陷阱）。app 的
    # AUTH_SECRET fail-fast 下限由测试 .env.test 中的合规哨兵值满足。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (.[test])
        working-directory: py-server
        run: pip install -e ".[test]"
      - name: System tests
        working-directory: py-server
        run: pytest -m "system and not p0_regression" --timeout=180 -q

  # ── 真实向量库：milvus-lite（in-process，无需 docker 服务） ──
  #
  # ⚠️ 本 job 曾长期「假绿」，2026-10-07 修复。两处独立缺陷叠加：
  #   1) 启动命令写的 `from milvus_lite import MilvusServer` 在任何现代版本里
  #      都不存在 —— 2.5.1 的 API 是 milvus_lite.server.Server，而 3.0（2026-05-13）
  #      起整个引擎重写为纯 Python，只导出 MilvusLite / server_manager_instance。
  #      于是该进程秒退；而轮询循环末尾没有 exit 1，step 照样返回 0 → 服务从未起来。
  #   2) 本 job 未传 MILVUS_ENABLED，而 config.py 的 milvus.enabled 默认 False，
  #      VectorDB.connect() 会直接走 InMemory 分支返回 False
  #      → 4 个用例全部 pytest.skip() → pytest exit 0 → job 绿。
  #    即：这道门禁从未真正执行过任何断言（比红更糟，它制造了安全感）。
  #
  # 修复后本地实测（milvus-lite 3.2.1 + pymilvus 2.6.17，Windows）：
  #   服务 2s 监听 19530，4 个用例 20.3s 全过（4 passed）。
  requires-milvus:
    name: Requires Milvus (Linux, milvus-lite)
    needs: p0-regression-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MILVUS_HOST: 127.0.0.1
      MILVUS_PORT: "19530"
      # 必须显式开启：milvus.enabled 默认 False，不开则 connect() 直接
      # 回退 InMemory 并返回 False，用例会以「需要真实 Milvus 服务端」为由全量 skip。
      MILVUS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (.[test]) + milvus-lite
        working-directory: py-server
        # pin 到 3.x：纯 Python 引擎（约 115KB，替代旧版 55MB 且仅 linux/mac 的
        # C++ 二进制），其 gRPC 服务默认端口恰为 19530（adapter.grpc.server.DEFAULT_PORT）。
        run: pip install -e ".[test]" && pip install "milvus-lite>=3.2,<4"
      - name: Start milvus-lite in background
        working-directory: py-server
        run: |
          mkdir -p milvus_lite_ci
          nohup python -c "
          from milvus_lite.adapter.grpc.server import run_server
          run_server(data_dir='./milvus_lite_ci', host='127.0.0.1', port=19530)
          " > milvus_lite.log 2>&1 &
          for i in $(seq 1 30); do
            if python -c "import socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1',19530)); s.close(); exit(0)" 2>/dev/null; then
              echo "milvus-lite ready after ~$((i*2))s"; exit 0
            fi
            sleep 2
          done
          # fail-closed：起不来就必须红 —— 否则这道门禁又退化成假绿
          echo "::error::milvus-lite 未在 60s 内监听 19530"
          cat milvus_lite.log
          exit 1
      - name: "Milvus startup guard (fail-closed: 拒绝静默回退 InMemory)"
        working-directory: py-server
        # 与 ci.yml 的 backend-milvus 同款守卫：先真连一次再放行。
        run: |
          python - <<'PY'
          from db.milvus_client import MILVUS_AVAILABLE, VectorDB
          assert MILVUS_AVAILABLE, "pymilvus 未安装：MILVUS_AVAILABLE=False"
          vdb = VectorDB()
          try:
              assert vdb.connect() and vdb._milvus_connected, \
                  "连不上 milvus-lite（拒绝静默回退 InMemory）"
              print("OK: milvus-lite 真实连接成功")
          finally:
              vdb.disconnect()
          PY
      - name: Requires Milvus tests
        working-directory: py-server
        # ⚠️ 必须 pipefail：`pytest | tee` 的退出码默认是 tee 的，pytest 失败会被
        # 静默吞掉（tee 恒返回 0）。缺了它，"部分用例 failed" 场景下 job 照样绿 ——
        # 与上面刚修掉的假绿是同一类病。backend-test.yml 亦统一用 set -euo pipefail。
        run: |
          set -euo pipefail
          pytest -m requires_milvus --timeout=300 -q -rs | tee requires_milvus.log
          # 第二重兜底（pipefail 管不到的场景）：全部 skip 时 pytest 返回 0，
          # 门禁空转。故显式要求至少有一条用例真的 passed。
          if ! grep -qE "[0-9]+ passed" requires_milvus.log; then
            echo "::error::requires_milvus 无任何用例实际通过（疑似全部 skip）—— 拒绝假绿"
            exit 1
          fi

  # ── 慢速：仅 nightly (schedule) 触发 ──
  slow:
    name: Slow (nightly)
    if: github.event_name == 'schedule'
    needs: [p0-regression-gate, fast-unit, system, requires-milvus]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (.[test])
        working-directory: py-server
        run: pip install -e ".[test]"
      - name: Slow tests（nightly）
        # 现状（2026-10-08 实测，非推测）：全仓 **0 处** `slow` 标记使用 ——
        #   `grep -rn "mark.slow" py-server/tests` 无命中，`git log -S "mark.slow"` 亦为空
        #   （历史上从未出现过）；pyproject 只声明了该 marker，并把它排除在默认 addopts 之外。
        # 后果：`pytest -m slow` 收 **0 条**用例（全量 1407 全部 deselected）→ pytest
        #   退出码 **5** = no tests collected → 本 job 每晚**必然变红**，而红的原因与代码
        #   质量无关，纯属"分档被声明了却从未有过内容"。
        # 处理：显式承认"当前无用例"这一**事实**并把 5 归零，同时打 warning 让它在每次
        #   运行里可见（而不是悄悄绿）。**其余任何退出码原样透传** —— 一旦有用例被标 slow，
        #   5 就不再出现，正常断言自动接管，失败照旧红。
        # 这与"永远绿的假闸门"的区别：它不声称自己覆盖了什么，反而把"0 条"打进日志与
        #   注解；真正决定它是否有意义的是 slow 用例是否存在。
        # 备选方案（未采用）：直接删掉本 job。之所以不删，是因为 marker 已声明为
        #   "nightly 运行"，留着可避免"将来有人标了 slow 却静默无人跑"的陷阱。
        working-directory: py-server
        run: |
          set -uo pipefail
          rc=0
          pytest -m slow --timeout=600 -q || rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "::warning::slow 分档当前 0 条用例（pytest exit 5 = no tests collected）；marker 已声明但全仓未使用。接入 slow 用例后本分支自然失效，失败将照常变红。"
            exit 0
          fi
          exit "$rc"
