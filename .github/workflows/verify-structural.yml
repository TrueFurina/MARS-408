name: verify-structural

# 结构守门脚本上 CI（审计 2026-10-06 · P0-5）
# ---------------------------------------------------------------------------
# 背景：8 个 `verify_*` + `scripts/brand_scan.py` + `scripts/scan_stale_calibration.py`
# 此前**零 workflow 引用**——代码改坏它们也没人报警（审计定级 P0：红了没人知道）。
#
# 本 workflow 把它们接上 CI，按"是否需要外部基础设施"分两档：
#
#   • `structural` job（PR / push 自动跑，阻塞合并）
#       跑「无需外部基础设施」的 6 个 verify_* + brand_scan + scan_stale_calibration
#       + check_hardcoded_paths（防脚本里写死本机绝对路径）+ honesty_scan
#       + verify_metrics（工程规模指标 SSOT 防漂移）。见下方注释。
#       这些脚本只依赖 sqlite / numpy / fastapi / 内置语料，CI 标准 python 即可跑。
#
#   • `heavy` job（仅 workflow_dispatch 手动触发，不阻塞合并）
#       跑 2 个依赖 Milvus 向量库 + E5 模型的 verify_*
#       （gold_candidates / retrieval）。它们在无 KB 的 CI 上会「真空通过」
#       （返回 0 条），属假绿，故**默认不进 PR 门禁**；需在已挂载 Milvus + KB
#       的运行器（如实验服务器 / 自托管 runner）上手动触发，并且本 job 设
#       `continue-on-error`，避免污染默认门禁。真空（KB 未挂载）会被显式判失败。

on:
  pull_request:
  push:
    branches: [career-literacy, main]
  workflow_dispatch:
    inputs:
      heavy:
        description: '同时运行依赖 Milvus+KB 的重型 verify（需运行器已挂载向量库）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须取全历史：verify_app_wiring.py 用 `git show f36b83e:py-server/main.py`
          # 读 M-4 拆分前的基线 router 列表。默认 fetch-depth=1（浅克隆）下该对象不存在，
          # `git show` 以 `fatal: invalid object name` 退出 128 → 整个 job 变红
          # （实测 2026-10-08 run 37787528182）。ci.yml / gates.yml 同样声明了 fetch-depth: 0。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 py-server 依赖
        run: |
          python -m pip install --upgrade pip
          cd py-server && pip install -e ".[test]" && cd ..

      - name: 运行结构守门（轻量 6 + 品牌/口径扫描）
        run: |
          set -u
          fail=0
          run_one () {
            local desc="$1"; local cmd="$2"; local wd="$3"
            echo "── $desc ──"
            # ⚠️ 必须写成 `... || rc=$?`，不能只写 `( ... ); local rc=$?`。
            # GitHub Actions 的 `run:` 默认 shell 是 `bash --noprofile --norc -eo pipefail {0}`
            # —— **-e 是默认开的**，写 `set -u` 并不会取消它。旧写法里 subshell 的非零退出
            # 会立刻触发 errexit，整个 step 在**第一个失败的脚本**处就地终止，
            # 于是后面的 `❌ ... 失败` 与末尾 `🔴 结构守门存在失败项` **永远打印不出来**：
            # 本段看起来"累积全部失败再汇总"，实际退化成"只报第一个，且连第一个也不报"。
            # 实测 run 37812723531：日志停在 `── verify_core_lock_unification ──` 的 traceback
            # 之后直接 `##[error]Process completed with exit code 1.`，没有任何 ❌ 行。
            # 把失败放进 `||` 右侧即成为 errexit 的豁免上下文。
            local rc=0
            ( cd "$wd" && eval "$cmd" ) || rc=$?
            if [ "$rc" -ne 0 ]; then echo "  ❌ $desc 失败 (exit=$rc)"; fail=1; else echo "  ✅ $desc 通过"; fi
          }

          # 品牌一致性（产品可见层 + 身份展示面）
          run_one "gate:brand (brand_scan)" "python scripts/brand_scan.py" "."
          # 对外口径诚信红线（原仅挂本地 pre-commit hook；CI 不拦则 force-push / 绕 hook 改 main 可重引被禁宣称）
          run_one "honesty_scan (对外口径红线)" "python scripts/pre-commit/honesty_scan.py --all" "."
          # benchmark 口径漂移扫描（活文档面）
          run_one "scan_stale_calibration" "python scripts/scan_stale_calibration.py" "."
          # 工程规模指标 SSOT（views / .vue / 代码量 / API 路径与操作数）：
          # 文档 docs/METRICS_CURRENT.md 的真值表 vs 实测重算，防"手抄数字"漂移。
          # 背景：README 曾多次漂移（views 45→46、后端文件 414→374、API 约240→244、测试 917→1177）。
          # 改动代码后请跑 `python scripts/verify_metrics.py --update` 同步文档。
          run_one "verify_metrics (工程规模指标 SSOT)" "python scripts/verify_metrics.py" "."
          # 本机绝对路径扫描（静态、最便宜，故放最前）：
          # 防的是「脚本里写死开发机路径 ⇒ Linux runner 上 FileNotFoundError ⇒ job 红，
          # 而开发机因为该路径真的存在而全绿」。实测事故：run 37812723531，
          # verify_core_lock_unification.py 曾写死 r"E:\Program\MARL\study-help-pro\py-server"。
          # 本脚本自身 fail-closed：扫到 0 个对象时 exit 2（不是打印"合规"）。
          run_one "check_hardcoded_paths" "python scripts/check_hardcoded_paths.py" "."

          # 轻量结构守门：sqlite / numpy / fastapi / 内置语料，无需 Milvus
          run_one "verify_app_wiring"            "python scripts/verify_app_wiring.py"            "py-server"
          run_one "verify_auth_coverage"         "python scripts/verify_auth_coverage.py"         "py-server"
          run_one "verify_core_lock_unification" "python scripts/verify_core_lock_unification.py" "py-server"
          run_one "verify_kb_coverage"           "python scripts/verify_kb_coverage.py"           "py-server"
          run_one "verify_seed_data_split"       "python scripts/verify_seed_data_split.py"       "py-server"
          run_one "verify_user_store_split"      "python scripts/verify_user_store_split.py"      "py-server"

          echo
          if [ $fail -ne 0 ]; then echo "🔴 结构守门存在失败项"; exit 1; fi
          echo "🟢 结构守门全部通过"

  heavy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.heavy == true
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 与 structural 一致：verify_* 可能读历史对象

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 py-server 依赖
        run: |
          python -m pip install --upgrade pip
          cd py-server && pip install -e ".[test]" && cd ..

      - name: 运行重型 verify（需 Milvus + KB）
        run: |
          set -u
          cd py-server
          echo "── verify_gold_candidates ──"
          python scripts/verify_gold_candidates.py | tee /tmp/gc.log
          echo "── verify_retrieval ──"
          python scripts/verify_retrieval.py | tee /tmp/rt.log
          # 无 KB 时这两个脚本会「真空通过」（返回 0 条），属假绿；
          # 显式判定真空为失败，避免在缺向量库的运行器上误报绿。
          # 粒度必须分开判（2026-10-09 修）：
          #   - verify_gold_candidates 只在**末行汇总**打印「保留 N/总数 题」⇒ N=0 即真空；
          #   - verify_retrieval 对 4 个 CASES **各打印一行**「返回 N 条」⇒ 必须判「全部为 0」。
          #     旧写法 `grep -qE "返回 0 条"` 判的是「任一为 0」⇒ 只要 4 个查询里有 1 个恰好
          #     0 命中就误报真空并 exit 1，把正常运行判成「KB 未挂载」。
          # 另注：以输出文本为判据是退而求其次 —— 这两个脚本自身不是 fail-closed 的。
          # 何时把它们改成"自带覆盖率结论、零覆盖 exit 2"，何时即可删掉本段兜底。
          if grep -qE "保留 0/" /tmp/gc.log; then
            echo "⚠️ 重型 verify 真空通过（gold_candidates 保留 0）：KB 未挂载？此类 verify 需要 Milvus + KB。"
            exit 1
          fi
          rt_total=$(grep -cE "^Q\[" /tmp/rt.log || true)
          rt_zero=$(grep -cE "返回 0 条" /tmp/rt.log || true)
          if [ "$rt_total" -gt 0 ] && [ "$rt_zero" -eq "$rt_total" ]; then
            echo "⚠️ 重型 verify 真空通过（retrieval ${rt_zero}/${rt_total} 个查询全为 0 条）：KB 未挂载？"
            exit 1
          fi
          echo "🟢 重型 verify 非真空通过（retrieval 0 条查询 ${rt_zero}/${rt_total}）"
