name: CI Security Gate (芒得很职 / study-help-pro)

# 固化已修复的安全缺陷，防 regression。任一阻塞门禁失败即阻断 PR 合并。
on:
  push:
  pull_request:

# 仅读权限，密钥不在此 workflow 暴露
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────
  # 快速确定性门禁（G1–G12）：秒级，必须绿才能合并
  # ───────────────────────────────────────────────────────────────
  security-gates:
    name: Security static gates (G1-G12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static security gates G1-G12
        run: |
          fail() { echo "FAIL: $1"; exit 1; }

          echo "== G1: 默认管理员口令不得回归 =="
          grep -n "ADMIN_PASSWORD" docker-compose.yml | grep -q 'ADMIN_PASSWORD=${ADMIN_PASSWORD}$' \
            || fail "G1 compose 缺少 ADMIN_PASSWORD=\${ADMIN_PASSWORD}（无默认值）"
          grep -q 'ADMIN_PASSWORD=${ADMIN_PASSWORD:-' docker-compose.yml \
            && fail "G1 compose 不得为 ADMIN_PASSWORD 提供默认口令"
          grep -n 'AUTH_SECRET' docker-compose.yml | grep -q 'AUTH_SECRET=${AUTH_SECRET}$' \
            || fail "G15 compose 缺少 AUTH_SECRET=\${AUTH_SECRET}（无默认值）"
          grep -q 'AUTH_SECRET=${AUTH_SECRET:-' docker-compose.yml \
            && fail "G15 compose 不得为 AUTH_SECRET 提供默认值"
          # 仅扫 py-server/ src/ docker-compose.yml；不扫 Student@2026（dev 种子演示账号，不在 G1 范围）
          # ① 正向 fail-closed：两个目录扫描面必须在位。
          #    原因（2026-10-09 变异实测）：`grep -rn` 传**多个根**时，只要任一根缺失，
          #    grep 整体就返回非零（对缺失路径 exit 2）⇒ 下面的 `&& fail` 恒不触发
          #    ⇒ 整条弱口令检查**静默失效**，连仍在位那些面里的真违规也一并被吞掉。
          #    实测：src/leak.vue 内含真实弱口令、但缺 py-server/ 时，本段仍打印 PASS G1。
          for p in py-server src; do
            test -e "$p" || fail "G1 弱口令扫描面缺失：$p/（门禁指向失效路径，会使整条检查静默失效）"
          done
          # ② 反向（有则失败）：用 if/then 而非 `&& fail`，把 grep 的非零退出码
          #    （"未命中" 与 "路径错误" 两种含义）明确分开 —— 有了 ① 之后此处只可能是"未命中"。
          if grep -rn "MARS-408@2026" --include=*.py --include=*.yml --include=*.yaml --include=*.vue \
               py-server/ src/ docker-compose.yml; then
            fail "G1 仓库内再次出现已知弱口令 MARS-408@2026"
          fi
          echo "  PASS G1"

          echo "== G3: 代码沙箱逃逸防护在位 =="
          grep -q "_DANGEROUS_SUBSCRIPT_BASES" py-server/api/sandbox.py \
            || fail "G3 缺少 _DANGEROUS_SUBSCRIPT_BASES 下标绕过拦截"
          grep -q "setrlimit" py-server/api/sandbox.py \
            || fail "G3 缺少 setrlimit 资源上限"
          grep -q "killpg" py-server/api/sandbox.py \
            || fail "G3 缺少 killpg 超时整体杀进程组"
          echo "  PASS G3"

          echo "== G4: 用户凭证库不出 git =="
          # ① 正向 fail-closed：git 可用 + 扫描面在位，否则"扫到 0 个"不构成"没入库"的证据。
          #    （2026-10-09 变异实测：沙箱里不建 py-server/data/ 时，本段照旧打印 PASS G4 ——
          #      即扫描面一旦被改名/搬走，凭证库检查会静默放行。同 G10 的失效形态。）
          git rev-parse --git-dir >/dev/null 2>&1 \
            || fail "G4 不在 git 仓库内，无法判定凭证库是否入库（零覆盖）"
          test -d py-server/data \
            || fail "G4 扫描面 py-server/data/ 不存在（门禁指向失效路径，会使检查静默放行）"
          # ② 反向（有则失败）
          tracked=$(git ls-files | grep -E 'py-server/data/.*\.(db|db-shm|db-wal|sqlite|sqlite3|db-journal)$' || true)
          test -z "$tracked" || fail "G4 用户凭证库被 git 跟踪: ${tracked}"
          echo "  PASS G4"

          echo "== G6: PBKDF2 >= 600_000 迭代 =="
          grep -q "PBKDF2_ITERATIONS = 600_000" py-server/db/user_store.py \
            || fail "G6 PBKDF2_ITERATIONS 必须为 600_000"
          # 仅校验常量定义与 _hash_password 调用；_verify_password 保留 100_000 旧格式兼容，不应被标记
          grep -n "pbkdf2_hmac" py-server/db/user_store.py | grep -q "PBKDF2_ITERATIONS" \
            || fail "G6 _hash_password 必须使用 PBKDF2_ITERATIONS 常量（不得写死 100_000）"
          echo "  PASS G6"

          echo "== G8: S1 导入路径穿越拒绝（ADR-007）== "
          grep -q "DOCS_DIR" py-server/services/import_worker.py \
            || fail "G8 缺少 DOCS_DIR 锚点"
          grep -q "拒绝越界" py-server/services/import_worker.py \
            || fail "G8 缺少越界拒绝分支（拒绝越界 source）"
          grep -q "parents" py-server/services/import_worker.py \
            || fail "G8 缺少 parents 越界校验"
          echo "  PASS G8"

          echo "== G10: CORS/CSP 收紧 + 上传上限 =="
          # 承载位置：CORS/CSP 随 M-4 拆分（main.py 882 -> 86 行）迁至 app/middleware.py。
          # 原门禁只 grep py-server/main.py，而该文件已无 CORS/CSP；那四条又都是
          # 「有则失败」型断言 —— grep 在失效路径上恒不命中，于是恒不 fail。
          # 实测（2026-10-08 变异验证）：把生产 middleware.py 的 CORS 改成
          # allow_origins=["*"]，本门禁仍报 ALL SECURITY GATES PASSED（假绿）。
          # 故改为「正向 fail-closed + 反向禁止」两段式，与 G7/G9 同口径。
          G10_FILES="py-server/app/middleware.py py-server/main.py"
          # ① 正向（fail-closed）：承载文件必须在位，且必须能看出「生产收紧 + 开发白名单」
          test -f py-server/app/middleware.py \
            || fail "G10 CORS/CSP 承载文件 py-server/app/middleware.py 不存在（门禁指向失效路径）"
          grep -q "is_production" py-server/app/middleware.py \
            || fail "G10 CORS 缺少生产分支收紧（is_production）"
          grep -q "allow_origin_regex" py-server/app/middleware.py \
            || fail "G10 CORS 缺少开发环境 origin regex 白名单"
          # ② 反向（有则失败）：通配 / unsafe-eval 出现在任一承载文件即红。
          #    覆盖赋值 `x["allow_origins"]=["*"]` 与 dict 字面量 `"allow_origins": ["*"]` 两种写法。
          grep -nE '(allow_origins|allow_methods|allow_headers)[^=]*=[^=]*\[[[:space:]]*"\*"' $G10_FILES \
            && fail "G10 CORS allow_origins/methods/headers 不得为通配 ['*']"
          grep -nE '"(allow_origins|allow_methods|allow_headers)"[[:space:]]*:[[:space:]]*\[[[:space:]]*"\*"' $G10_FILES \
            && fail "G10 CORS allow_origins/methods/headers 不得为通配 ['*']（dict 字面量写法）"
          grep -n "unsafe-eval" $G10_FILES \
            && fail "G10 CSP 不得含 unsafe-eval"
          grep -q "MAX_UPLOAD_MB" py-server/api/knowledge.py \
            || fail "G10 knowledge.py 缺少 MAX_UPLOAD_MB 上传上限"
          echo "  PASS G10"

          # G11（SVG 注入转义）已迁移至下方 AST 断言承载，理由见 security_gate_assert.py
          # 的 assert_g11_html_escape_called 文档：原 `grep -q "html.escape"` 的 `.` 未转义，
          # 同形名 html_escape 可蒙混；且纯存在性使「注释掉调用」照样通过（均经实测复核）。

          echo "== G12: 确定性文档 ID（sha256，非 abs(hash())）=="
          grep -q "hashlib.sha256" py-server/api/knowledge.py \
            || fail "G12 knowledge.py 缺少 hashlib.sha256"
          # 作用域限定 knowledge.py；mindmap.py 的 abs(hash() 非安全关键，不在本门禁范围
          grep -n "abs(hash(" py-server/api/knowledge.py \
            && fail "G12 knowledge.py 不得出现 abs(hash( 非确定性 ID"
          echo "  PASS G12"

          echo "== G2/G5/G7/G9/G11: AST 断言（fail-closed 限流 / AUTH_SECRET fail-fast / demo 仅非生产 / workers>1 fail-fast / SVG 转义实际调用）=="
          python scripts/security_gate_assert.py \
            || fail "G2/G5/G7/G9/G11 AST 断言失败"
          echo "  PASS G2/G5/G7/G9/G11"

          echo "ALL SECURITY GATES PASSED"

  # ───────────────────────────────────────────────────────────────
  # 密钥扫描（gitleaks v8.21.0，全量含历史）：失败即阻断
  # ───────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (gitleaks v8.21.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量历史扫描，避免只扫工作树/最近提交漏掉历史密钥
          fetch-depth: 0
      - name: Install gitleaks v8.21.0
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.0/gitleaks_8.21.0_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Run gitleaks detect
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  # ───────────────────────────────────────────────────────────────
  # 前端质量门禁（lint + 单测 + vue-tsc 类型检查 + vite 构建）：任一失败即阻断
  # 闭合评审指出的「前后端门禁失衡」——后端 7+ job，前端此前仅 type-check+build、0 测试
  # ───────────────────────────────────────────────────────────────
  lint-build:
    name: Frontend lint + test + type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: ESLint (zero-error gate)
        run: npm run lint
      - name: Vitest unit tests
        run: npm test
      - name: Type-check + build
        run: npm run build

  # ───────────────────────────────────────────────────────────────
  # 后端测试 · 单元/集成/API 回归（安全测试集 + 覆盖率趋势）：失败即阻断
  # 不含 system / requires_milvus 分档，避免 Windows 本地 SIGSEGV 与重依赖
  # ───────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend tests (unit/integration/API + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ── 本 job 刻意不依赖 Milvus（2026-10-07 移除遗留的 docker Milvus）──
      # 移除前这里 `docker run milvusdb/milvus` + healthz 探针，但它是**死重量**，证据：
      #   · 本 job 从不设置 MILVUS_ENABLED（全仓 MILVUS_* 仅出现在 backend-milvus job）；
      #   · py-server/config.json 未入库（.gitignore:111），CI 只有已入库的
      #     config.example.json，而 load_config 只在 CONFIG_PATH 存在时才合并文件，
      #     故 CI 实取 config.py:95 的 DEFAULTS `milvus.enabled = False`；
      #   · 因此 db/milvus_client.py:534 的 `MILVUS_AVAILABLE and enabled` 恒假，
      #     VectorDB 全程走 InMemoryVectorStore；
      #   · 三处 pytest 调用又都显式排除 requires_milvus（见下方各 step）。
      # 即：那个容器**不被任何断言使用**，却只贡献「docker 拉取失败 / healthz 超时 →
      # 整个 job 假红」的失败面。真实 Milvus 覆盖由 backend-milvus job 承担。
      # 下方 guard step 把「本 job 不连 Milvus」从注释升级为 fail-closed 断言。
      - name: Install backend (editable, with test extras)
        run: pip install --upgrade pip && pip install -e ".[test]"
      - name: Vector store contract guard (本 job 必须跑 InMemory，不连 Milvus)
        # 目的：把「本 job 不依赖真实 Milvus」变成可执行断言，fail-closed。
        # 若日后有人给本 job 注入 MILVUS_ENABLED=true，或改掉 config 默认值，这里先红，
        # 而不是让上千条用例静默改跑另一条路径（即另一种形态的假绿）。
        # 该 guard 无网络依赖、无原生扩展依赖，行为确定。
        run: |
          python - <<'PY'
          from db.milvus_client import MILVUS_AVAILABLE, VectorDB
          from config import get_milvus_config

          cfg = get_milvus_config()
          vdb = VectorDB()
          vdb.connect()
          assert vdb._milvus_connected is False, (
              "backend-tests 不应连上真实 Milvus（该档由 backend-milvus job 覆盖）；"
              f"实测 _milvus_connected={vdb._milvus_connected}, enabled={cfg.get('enabled')!r}"
          )
          print(
              "OK: VectorDB 走 InMemoryVectorStore "
              f"(MILVUS_AVAILABLE={MILVUS_AVAILABLE}, config.milvus.enabled={cfg.get('enabled')!r})"
          )
          PY
      - name: Run pytest (unit/integration/API, coverage xml)
        run: pytest -m "not system and not requires_milvus" --cov=. --cov-report=xml:coverage.xml --cov-fail-under=50 -q
      - name: ADR-007 single-writer gate (import_queue)
        run: pytest -m import_queue -q
      - name: P0 regression gate (p0_regression — wave-1 核心基线，必绿)
        # wave-1 核心回归基线：单一真值源护栏 / CTO §6.1 三门 / career LLM 失败安全兜底。
        # 只跑非 system 的 p0（test_p0_f6 属 system 分档，由 backend-system job 覆盖），
        # 显式排除 system/requires_milvus，避免在此 job 拉起真实 uvicorn / Milvus。
        run: pytest -m "p0_regression and not system and not requires_milvus" -q
      - name: Criteria-A review capture gate (review_capture — 泛化集 capture ≥0.99)
        # 判据A：analytic 解析最优档在独立泛化集上的 capture 必须 ≥99%（实测 100.0%）。
        # 固化 experiments/accept_review.py 判据A 为可自动守护的 CI 门禁。
        run: pytest -m review_capture -q
      - name: OpenAPI contract drift gate (snapshot == runtime, fail-closed)
        # 随包发出的 py-server/openapi.json 必须与运行时真实能力一致。
        # 2026-10-06 实锤事故：工作区快照已对齐(227/244)，但交付 zip 内那份
        # 仍是旧的 223/240 —— 修复停在仓库层、没到交付面。故这道闸无条件跑，
        # 且**不用条件触发**（与 pre-commit.sh 的按改动触发相反）：
        # CI 是"PR 只改文档"场景下契约闸仍然执行的保证。
        # exit 1 = 有漂移；exit 2 = 环境缺失（同样不放行，fail-closed）。
        run: python ../scripts/verify_openapi_snapshot.py
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: py-server/coverage.xml
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────
  # 后端系统测试（真实 uvicorn 子进程 + 进程级并发）：超时保护防挂起
  # ───────────────────────────────────────────────────────────────
  backend-system:
    name: Backend system tests (real uvicorn, --timeout=180)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (editable, with test extras)
        run: pip install --upgrade pip && pip install -e ".[test]"
      - name: Run system tests (timeout guard)
        run: pytest -m system --timeout=180 -q

  # ───────────────────────────────────────────────────────────────
  # 后端 Milvus 集成（真实 Milvus 服务端 + pymilvus）：
  # startup guard 断言真连，杜绝「CI 全绿实际跑 InMemory」虚假信心（D14 闭环）
  # ───────────────────────────────────────────────────────────────
  backend-milvus:
    name: Backend Milvus integration (real server + startup guard)
    runs-on: ubuntu-latest
    # MILVUS_HOST 置于 job 级 env，使其对 pytest/python 步骤可见
    # （milvus 服务容器本身无需此变量；connect() 默认 host 已是 localhost，
    #  此处显式声明以对齐草案并确保健康检查脚本拿到正确 host）
    env:
      MILVUS_HOST: localhost
      MILVUS_PORT: "19530"
      MILVUS_ENABLED: "true"
      # docker run 起的 milvus-standalone 映射在 localhost:19530；本 job 显式启用
      # Milvus（config 默认 enabled=False），让 startup guard 真正去连真实服务端，
      # 拒绝静默回退 InMemory。
    defaults:
      run:
        working-directory: py-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (editable, with test extras)
        run: pip install --upgrade pip && pip install -e ".[test]"
      - name: Start Milvus standalone (docker run, embedded etcd + local storage)
        # 不使用 GitHub service 容器：milvusdb/milvus 镜像的 tini 入口点在
        # service-container 模式下收不到启动程序、会秒退打印 -h 帮助即退出。
        # 改为显式 `docker run ... milvus run standalone`（GitHub 托管 runner 自带 docker），
        # 直接让 tini 执行 milvus 子命令，绕开该包装问题。
        run: |
          docker run -d --name milvus-standalone \
            -p 19530:19530 -p 9091:9091 \
            -e ETCD_USE_EMBED=true \
            -e ETCD_DATA_DIR=/var/lib/milvus/etcd \
            -e COMMON_STORAGETYPE=local \
            --health-cmd "curl -f http://localhost:9091/healthz || exit 1" \
            --health-interval 10s --health-timeout 5s --health-retries 30 \
            milvusdb/milvus:v2.4.17 \
            milvus run standalone
          echo "waiting for Milvus health (max ~120s)..."
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' milvus-standalone 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then echo "Milvus healthy after ~$((i*5))s"; break; fi
            echo "  [$i] status=$status"
            sleep 5
          done
      - name: "Milvus startup guard (fail-closed: 拒绝静默回退 InMemory)"
        # 含重试（最多 ~120s，每次 5s），容忍 Milvus standalone 冷启动延迟；
        # 仍坚持 fail-closed：必须真连上且 _milvus_connected 为真，否则作业立即红。
        run: |
          python - <<'PY'
          import time
          from db.milvus_client import MILVUS_AVAILABLE, VectorDB
          assert MILVUS_AVAILABLE, "pymilvus 未安装：MILVUS_AVAILABLE=False"
          last_err = None
          for _ in range(24):  # 最多 ~120s
              vdb = VectorDB()
              try:
                  connected = vdb.connect()
              except Exception as e:  # noqa: BLE001
                  connected = False
                  last_err = e
              if connected and vdb._milvus_connected:
                  print("OK: Milvus 真实连接成功")
                  vdb.disconnect()
                  break
              try:
                  vdb.disconnect()
              except Exception:  # noqa: BLE001
                  pass
              time.sleep(5)
          else:
              raise AssertionError(f"Milvus 连接失败并静默回退（D14 防回退断言）：{last_err}")
          PY
      - name: Run Milvus integration tests
        # 与 p0-regression.yml 的 requires-milvus job 保持**同一套防护**（原先此处只有
        # 裸 `pytest -m requires_milvus -q`，缺两道）：
        #  1) 空跑兜底：全部用例被 skip 时 pytest 返回 0，job 会「零覆盖地绿」。
        #     故显式要求至少一条真的 passed。上方 startup guard 已断言 MILVUS_ENABLED
        #     与 _milvus_connected，能挡住"静默回退 InMemory"，但挡不住"一条都没跑"。
        #  2) --timeout：无超时保护时，卡住的用例会一直烧到 job 级超时（默认 6h）。
        # pipefail 必须与 `| tee` 同用，否则管道退出码取 tee（恒 0），失败被吞。
        run: |
          set -euo pipefail
          pytest -m requires_milvus --timeout=300 -q -rs | tee requires_milvus.log
          if ! grep -qE "[0-9]+ passed" requires_milvus.log; then
            echo "::error::requires_milvus 无任何用例实际通过（疑似全部 skip）—— 拒绝假绿"
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────
  # 依赖 CVE 扫描（pip-audit）：发现已知漏洞即阻断
  #
  # 注意：原先写作 `pip-audit --fail-on high`，但 pip-audit 从未提供
  # `--fail-on` 参数（实测 2.10.1 亦无），该步骤一直以
  # "unrecognized arguments: --fail-on" 退出码 2 失败 —— 也就是说这道
  # CVE 安全门从未真正扫描过任何依赖，纯粹是个摆设。
  # pip-audit 也没有按严重度阈值失败的能力（其 JSON 输出不含 severity
  # 字段），因此这里退而求其次：任何已知漏洞都阻断，同时产出 JSON 报告
  # 供人工分级。
  #
  # ⚠️ 死锁陷阱（实测 pip-audit 2.10.1 源码，此前本 job 必然 100% 失败）：
  #   上一步 `pip install -e .` 把本项目 mangdehenzhi-server 装成可编辑安装。
  #   - `--skip-editable` 会把它变成 SkippedDependency(
  #       skip_reason="distribution marked as editable")；
  #   - 而 `--strict`(-S) 的定义是「依赖收集在任何依赖上失败则整个审计失败」，
  #     _cli.py 中对**任何** is_skipped() 的依赖直接 _fatal()。
  #   ⇒ `--skip-editable` + `--strict` 语义自相矛盾：跳过即失败。
  #   不加 `--skip-editable` 时若用默认的 PyPI 服务，本地包不在 PyPI 上会
  #   404 → 同样变成 SkippedDependency → `--strict` 依然判死。
  #
  # 正确解法：改用 **OSV 服务**（-s osv）。pypi.py 对未知包返回 SkippedDependency，
  # 而 osv.py 对未知包返回**空漏洞列表**（HTTP 200 + 空 JSON，不产生 skip）。
  # 于是本地包被正常审计并返回 0 漏洞，`--strict` 得以保留：
  # 任何「版本非法 / 网络不可达」这类真实盲区仍会让 job 失败。
  # ───────────────────────────────────────────────────────────────
  pip-audit-dep-cve:
    name: Dependency CVE scan (pip-audit / OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + pip-audit
        run: cd py-server && pip install --upgrade pip && pip install -e . && pip install pip-audit
      - name: Run pip-audit (block on any known vulnerability)
        run: cd py-server && pip-audit -s osv --strict --desc -f json -o pip-audit-report.json
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: py-server/pip-audit-report.json
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────
  # 设计令牌漂移门禁（SSOT）：任何原型改动若偏离 _variables.css 单一真相源即阻断
  # 与 P1 设计系统 SSOT 收口配套，确保零漂移成为硬约束（非仅本地手工跑）
  # ───────────────────────────────────────────────────────────────
  design-token-drift:
    name: Design token SSOT drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SSOT drift checker (fail on any drift)
        run: python design-system/check_tokens.py
      - name: Run component raw-value gate (fail on hardcoded hex/rgb)
        run: python design-system/check_raw_values.py
      - name: Run prose-doc token drift gate (fail if doc cites non-token color)
        run: python design-system/check_doc_tokens.py

  # ───────────────────────────────────────────────────────────────
  # 镜像可构建性（验证 Dockerfile 的 /static 挂载与单进程 CMD）
  # 前置契约：Dockerfile:49 `COPY dist ./static` 消费的是**宿主机预构建**产物
  #   （92d50c8 为绕开国内代理 SSL 掐断，删除了容器内 frontend-builder 阶段）。
  #   dist 被 .gitignore:24 忽略 → 新克隆的 checkout 里必然不存在，
  #   故本 job 必须自己复现该前置步骤，否则恒红（历史事故：92d50c8 改了
  #   Dockerfile 契约却未同步本 job 与 README，本 job 自那以后持续失败）。
  #   此处步骤必须与 README「Docker」章节记载的宿主机构建步骤保持一致。
  # ───────────────────────────────────────────────────────────────
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # 只跑 vite build（不含 vue-tsc）：类型检查已由 lint-build 覆盖，不重复付费
      - name: Prebuild frontend (satisfies Dockerfile COPY dist ./static)
        run: npm ci && npm run build-only
      - name: Build image
        run: docker build -t netlearn:ci .

  # ───────────────────────────────────────────────────────────────
  # 证据链门禁：前端不得引用 demo/合成数据源，且仓库内必须存在可用的真产物
  # 背景：scripts/benchmark_results.json 是 benchmark.py --demo 生成的合成数据，
  #       曾被误当真产物接入 BenchmarkView，导致"用假数据冒充实验证据"。
  # 本门禁复用后端 api/benchmark.py 的挑选函数，保证与生产口径同源（不重复实现）。
  # ───────────────────────────────────────────────────────────────
  benchmark-evidence-gate:
    name: Benchmark evidence chain gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run evidence chain gate (fail on demo leakage or missing real artifact)
        run: python tests/benchmark_evidence_gate.py
