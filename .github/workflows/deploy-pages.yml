name: Deploy to GitHub Pages

# 把静态前端（vite build 产物）部署到 GitHub Pages：
#   https://truefurina.github.io/MARS-408/
# 该仓库 Pages 使用 legacy 模式（从 gh-pages 分支部署），故用 peaceiris
# 推送 dist 到 gh-pages 分支，而非 actions/deploy-pages（GitHub Actions 模式）。
# 注意：GitHub Pages 仅承载静态前端；后端（py-server / FastAPI）不在此部署。
on:
  push:
    branches: [career-literacy]
  workflow_dispatch:

permissions:
  contents: write

# 同一次部署只保留最新运行，避免并发部署冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build-only
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
