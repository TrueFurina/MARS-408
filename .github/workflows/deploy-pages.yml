name: Deploy to GitHub Pages

# 把静态前端（vite build 产物）部署到 GitHub Pages：
#   https://truefurina.github.io/MARS-408/
# 注意：GitHub Pages 仅承载静态前端；后端（py-server / FastAPI）不在此部署，
# 登录、数据等接口需另行部署或本地运行。
on:
  push:
    branches: [career-literacy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一次部署只保留最新运行，避免并发部署冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build-only
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
