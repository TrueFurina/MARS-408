<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0b14"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>
    <linearGradient id="gradTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c6af2"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gradAgent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gradEngine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gradMem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gradData" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" rx="16"/>
  <text x="600" y="42" text-anchor="middle" fill="#fff" font-size="24" font-weight="700" letter-spacing="2">MARS-408 核心架构图</text>
  <text x="600" y="66" text-anchor="middle" fill="#94a3b8" font-size="12">408考研个性化学习多智能体系统 · L1/L2/L3 三层学情记忆全链路闭环</text>

  <!-- ═══ 前端层 ═══ -->
  <rect x="40" y="90" width="1120" height="110" rx="12" fill="#1e1e3a" stroke="#7c6af2" stroke-width="1.5" opacity="0.9"/>
  <text x="60" y="115" fill="#a78bfa" font-size="13" font-weight="700">① 前端应用层（Vue 3 · 36 页面 / 32 组件）</text>
  <!-- 前端四组 -->
  <rect x="60" y="128" width="250" height="56" rx="8" fill="#2a2a4a"/>
  <text x="185" y="152" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">学习核心</text>
  <text x="185" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">对话/出题/知识图谱/路径/复盘</text>
  <rect x="325" y="128" width="250" height="56" rx="8" fill="#2a2a4a"/>
  <text x="450" y="152" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">记忆可视化</text>
  <text x="450" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">L1/L2/L3 记忆中心/画像/评估</text>
  <rect x="590" y="128" width="250" height="56" rx="8" fill="#2a2a4a"/>
  <text x="715" y="152" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Skill 生态</text>
  <text x="715" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">技能市场/工作室/工具元数据</text>
  <rect x="855" y="128" width="280" height="56" rx="8" fill="#2a2a4a"/>
  <text x="995" y="152" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">教师/多角色</text>
  <text x="995" y="170" text-anchor="middle" fill="#94a3b8" font-size="10">教师看板/算法引擎/代码沙箱</text>

  <!-- 前端→API 箭头 -->
  <line x1="600" y1="200" x2="600" y2="228" stroke="#7c6af2" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7c6af2"/></marker></defs>

  <!-- ═══ API 层 ═══ -->
  <rect x="40" y="232" width="1120" height="62" rx="12" fill="#1e1e3a" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
  <text x="60" y="258" fill="#8b5cf6" font-size="13" font-weight="700">② API 网关层（FastAPI · 37 模块 · 196+ 端点 · 统一错误码 · 限流/熔断/审计）</text>
  <text x="60" y="280" fill="#94a3b8" font-size="10">HMAC Token 认证 · require_llm_quota 每用户配额 · 令牌桶 · 熔断器 · 安全响应头 · 审计日志</text>

  <!-- API→Agent 箭头 -->
  <line x1="600" y1="294" x2="600" y2="322" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow2)"/>
  <defs><marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6366f1"/></marker></defs>

  <!-- ═══ Agent 层 ═══ -->
  <rect x="40" y="326" width="1120" height="118" rx="12" fill="#1e1e3a" stroke="url(#gradAgent)" stroke-width="1.5" opacity="0.9"/>
  <text x="60" y="352" fill="#8b5cf6" font-size="13" font-weight="700">③ 多智能体编排层（LangGraph · 8 核心节点 · 27 Agent）</text>
  <!-- 8 节点流水线 -->
  <g font-size="10">
    <rect x="60" y="362" width="118" height="34" rx="6" fill="#4c1d95" opacity="0.8"/>
    <text x="119" y="383" text-anchor="middle" fill="#fff" font-weight="600">协调</text>
    <rect x="188" y="362" width="118" height="34" rx="6" fill="#5b21b6" opacity="0.8"/>
    <text x="247" y="383" text-anchor="middle" fill="#fff" font-weight="600">学情诊断</text>
    <rect x="316" y="362" width="118" height="34" rx="6" fill="#6d28d9" opacity="0.8"/>
    <text x="375" y="383" text-anchor="middle" fill="#fff" font-weight="600">路径规划</text>
    <rect x="444" y="362" width="118" height="34" rx="6" fill="#7c3aed" opacity="0.8"/>
    <text x="503" y="383" text-anchor="middle" fill="#fff" font-weight="600">检索</text>
    <rect x="572" y="362" width="118" height="34" rx="6" fill="#8b5cf6" opacity="0.8"/>
    <text x="631" y="383" text-anchor="middle" fill="#fff" font-weight="600">生成集群</text>
    <rect x="700" y="362" width="118" height="34" rx="6" fill="#a78bfa" opacity="0.8"/>
    <text x="759" y="383" text-anchor="middle" fill="#fff" font-weight="600">评估</text>
    <rect x="828" y="362" width="118" height="34" rx="6" fill="#c4b5fd" opacity="0.8"/>
    <text x="887" y="383" text-anchor="middle" fill="#1e1b4b" font-weight="600">质检</text>
    <rect x="956" y="362" width="118" height="34" rx="6" fill="#ddd6fe" opacity="0.8"/>
    <text x="1015" y="383" text-anchor="middle" fill="#1e1b4b" font-weight="600">证据校验</text>
  </g>
  <!-- 节点间箭头 -->
  <g stroke="#a78bfa" stroke-width="1.5">
    <line x1="178" y1="379" x2="184" y2="379"/><line x1="306" y1="379" x2="312" y2="379"/>
    <line x1="434" y1="379" x2="440" y2="379"/><line x1="562" y1="379" x2="568" y2="379"/>
    <line x1="690" y1="379" x2="696" y2="379"/><line x1="818" y1="379" x2="824" y2="379"/>
    <line x1="946" y1="379" x2="952" y2="379"/>
  </g>
  <text x="60" y="426" fill="#94a3b8" font-size="10">GoMARL 共识 · NeuralMixer 混合 · Agent 辩论 3 轮 · 质量闸门 · 证据冲突消解（20 类矛盾对）· 教学规则引擎</text>

  <!-- Agent→引擎 箭头 -->
  <line x1="600" y1="444" x2="600" y2="472" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow3)"/>
  <defs><marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8b5cf6"/></marker></defs>

  <!-- ═══ 引擎层 ═══ -->
  <rect x="40" y="476" width="1120" height="96" rx="12" fill="#1e1e3a" stroke="url(#gradEngine)" stroke-width="1.5" opacity="0.9"/>
  <text x="60" y="502" fill="#fbbf24" font-size="13" font-weight="700">④ 智能引擎层（规则降级保底）</text>
  <g font-size="10">
    <rect x="60" y="512" width="168" height="42" rx="6" fill="#78350f" opacity="0.8"/>
    <text x="144" y="530" text-anchor="middle" fill="#fde68a" font-weight="600">FrugalRAG 检索</text>
    <text x="144" y="545" text-anchor="middle" fill="#fcd34d" font-size="9">E5+BM25+Reranker</text>
    <rect x="244" y="512" width="168" height="42" rx="6" fill="#78350f" opacity="0.8"/>
    <text x="328" y="530" text-anchor="middle" fill="#fde68a" font-weight="600">GoMARL 共识</text>
    <text x="328" y="545" text-anchor="middle" fill="#fcd34d" font-size="9">质量闸门 7 分阈值</text>
    <rect x="428" y="512" width="168" height="42" rx="6" fill="#78350f" opacity="0.8"/>
    <text x="512" y="530" text-anchor="middle" fill="#fde68a" font-weight="600">NeuralMixer</text>
    <text x="512" y="545" text-anchor="middle" fill="#fcd34d" font-size="9">神经网络混合（torch降级）</text>
    <rect x="612" y="512" width="168" height="42" rx="6" fill="#78350f" opacity="0.8"/>
    <text x="696" y="530" text-anchor="middle" fill="#fde68a" font-weight="600">答题引擎</text>
    <text x="696" y="545" text-anchor="middle" fill="#fcd34d" font-size="9">步骤拆解/错因/薄弱追踪</text>
    <rect x="796" y="512" width="168" height="42" rx="6" fill="#78350f" opacity="0.8"/>
    <text x="880" y="530" text-anchor="middle" fill="#fde68a" font-weight="600">冲突消解</text>
    <text x="880" y="545" text-anchor="middle" fill="#fcd34d" font-size="9">证据矛盾检测+裁决</text>
    <rect x="980" y="512" width="155" height="42" rx="6" fill="#78350f" opacity="0.8"/>
    <text x="1057" y="530" text-anchor="middle" fill="#fde68a" font-weight="600">教学规则</text>
    <text x="1057" y="545" text-anchor="middle" fill="#fcd34d" font-size="9">408 前置依赖校验</text>
  </g>

  <!-- ═══ 记忆层（核心创新，突出） ═══ -->
  <rect x="40" y="590" width="1120" height="100" rx="12" fill="#0f2f24" stroke="url(#gradMem)" stroke-width="2" filter="url(#glow)"/>
  <text x="60" y="616" fill="#34d399" font-size="14" font-weight="700">⑤ 三层学情记忆（核心创新 · 对标 HKU-DeepTutor 记忆解耦）</text>
  <g font-size="11">
    <rect x="60" y="628" width="340" height="46" rx="8" fill="#065f46" opacity="0.85"/>
    <text x="230" y="648" text-anchor="middle" fill="#a7f3d0" font-weight="700">L1 工作记忆</text>
    <text x="230" y="665" text-anchor="middle" fill="#6ee7b7" font-size="9">会话上下文 · TTL 30min · 6 处回写</text>
    <rect x="420" y="628" width="340" height="46" rx="8" fill="#065f46" opacity="0.85"/>
    <text x="590" y="648" text-anchor="middle" fill="#a7f3d0" font-weight="700">L2 语义记忆</text>
    <text x="590" y="665" text-anchor="middle" fill="#6ee7b7" font-size="9">画像+掌握度+薄弱点 · 8 维 · 动态更新</text>
    <rect x="780" y="628" width="355" height="46" rx="8" fill="#065f46" opacity="0.85"/>
    <text x="957" y="648" text-anchor="middle" fill="#a7f3d0" font-weight="700">L3 情景记忆</text>
    <text x="957" y="665" text-anchor="middle" fill="#6ee7b7" font-size="9">答题/行为/资源事件流 · 90 天 · plugin_id 溯源</text>
  </g>
  <text x="60" y="682" fill="#6ee7b7" font-size="10">14 处 API 回写 · 20 Agent 注入 · 25+ 页面可视化 · Skill 插件读写权限（none/read/write/read_write）</text>

  <!-- ═══ 数据层 ═══ -->
  <rect x="40" y="708" width="1120" height="78" rx="12" fill="#1e1e3a" stroke="url(#gradData)" stroke-width="1.5" opacity="0.9"/>
  <text x="60" y="734" fill="#94a3b8" font-size="13" font-weight="700">⑥ 数据与外部服务层（多级降级）</text>
  <g font-size="10">
    <rect x="60" y="742" width="200" height="30" rx="6" fill="#334155" opacity="0.8"/>
    <text x="160" y="761" text-anchor="middle" fill="#e2e8f0">SQLite / PostgreSQL 降级</text>
    <rect x="276" y="742" width="210" height="30" rx="6" fill="#334155" opacity="0.8"/>
    <text x="381" y="761" text-anchor="middle" fill="#e2e8f0">Milvus → InMemory 向量库</text>
    <rect x="502" y="742" width="200" height="30" rx="6" fill="#334155" opacity="0.8"/>
    <text x="602" y="761" text-anchor="middle" fill="#e2e8f0">E5 嵌入 768 维 · 2083 chunks</text>
    <rect x="718" y="742" width="200" height="30" rx="6" fill="#334155" opacity="0.8"/>
    <text x="818" y="761" text-anchor="middle" fill="#e2e8f0">讯飞 X2 → DeepSeek → Qwen</text>
    <rect x="934" y="742" width="200" height="30" rx="6" fill="#334155" opacity="0.8"/>
    <text x="1034" y="761" text-anchor="middle" fill="#e2e8f0">Skill 插件热加载 + URL 白名单</text>
  </g>
</svg>
