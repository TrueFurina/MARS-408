<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Segoe UI',sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
    <marker id="ahd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="580" fill="#ffffff"/>
  <text x="30" y="30" font-size="20" font-weight="700" fill="#1a1a2e">芒得很职 · 智能体流水线（11 节点）— 状态显式传递与证据留痕</text>
  <text x="30" y="50" font-size="12" fill="#666">LangGraph StateGraph：triage 入口分级 → 7 种角色 + 证据校验 + 验收闸门 + 路径规划；状态(AgentState)逐节点显式传递</text>

  <!-- ============ 普通节点样式 ============ -->
  <!-- Row1 -->
  <g>
    <rect x="30" y="64" width="210" height="62" rx="10" fill="#7c6af2" stroke="#5b4bd1" stroke-width="2"/>
    <text x="135" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">① Triage 分级路由</text>
    <text x="135" y="113" text-anchor="middle" font-size="11" fill="#e8e3ff">低风险 API 层短路</text>

    <rect x="300" y="64" width="210" height="62" rx="10" fill="#f4f1ff" stroke="#7c6af2" stroke-width="2"/>
    <text x="405" y="99" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">② 全局协调</text>
    <text x="405" y="118" text-anchor="middle" font-size="11" fill="#666">coordinator</text>

    <rect x="570" y="64" width="210" height="62" rx="10" fill="#f4f1ff" stroke="#7c6af2" stroke-width="2"/>
    <text x="675" y="99" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">③ 学情诊断</text>
    <text x="675" y="118" text-anchor="middle" font-size="11" fill="#666">diagnostician</text>

    <rect x="840" y="64" width="210" height="62" rx="10" fill="#f4f1ff" stroke="#7c6af2" stroke-width="2"/>
    <text x="945" y="99" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">④ 任务规划</text>
    <text x="945" y="118" text-anchor="middle" font-size="11" fill="#666">planner</text>
  </g>

  <!-- Row2 (right -> left flow) -->
  <g>
    <rect x="840" y="246" width="210" height="62" rx="10" fill="#f4f1ff" stroke="#7c6af2" stroke-width="2"/>
    <text x="945" y="281" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">⑤ 检索优化</text>
    <text x="945" y="300" text-anchor="middle" font-size="11" fill="#666">retriever</text>

    <rect x="570" y="246" width="210" height="62" rx="10" fill="#f4f1ff" stroke="#7c6af2" stroke-width="2"/>
    <text x="675" y="281" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">⑥ 资源生成集群</text>
    <text x="675" y="300" text-anchor="middle" font-size="11" fill="#666">generator_cluster</text>

    <rect x="300" y="246" width="210" height="62" rx="10" fill="#f4f1ff" stroke="#7c6af2" stroke-width="2"/>
    <text x="405" y="281" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">⑦ 评估反馈</text>
    <text x="405" y="300" text-anchor="middle" font-size="11" fill="#666">assessor</text>

    <rect x="30" y="246" width="210" height="62" rx="10" fill="#f4f1ff" stroke="#7c6af2" stroke-width="2"/>
    <text x="135" y="281" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">⑧ 质量校验</text>
    <text x="135" y="300" text-anchor="middle" font-size="11" fill="#666">critic</text>
  </g>

  <!-- Row3 -->
  <g>
    <rect x="30" y="428" width="210" height="62" rx="10" fill="#e6f7f4" stroke="#0f9d8e" stroke-width="2.5"/>
    <text x="135" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#0b6b60">⑨ 证据校验</text>
    <text x="135" y="482" text-anchor="middle" font-size="11" fill="#0b6b60">evidence_check · 留痕</text>

    <rect x="300" y="428" width="210" height="62" rx="10" fill="#e6f7f4" stroke="#0f9d8e" stroke-width="2.5"/>
    <text x="405" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#0b6b60">⑩ 产物验收闸门</text>
    <text x="405" y="482" text-anchor="middle" font-size="11" fill="#0b6b60">quality_gate · 硬性阻断</text>

    <rect x="570" y="428" width="210" height="62" rx="10" fill="#f4f1ff" stroke="#7c6af2" stroke-width="2"/>
    <text x="675" y="463" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">⑪ 路径规划</text>
    <text x="675" y="482" text-anchor="middle" font-size="11" fill="#666">path_planner</text>

    <rect x="840" y="428" width="150" height="62" rx="10" fill="#1a1a2e" stroke="#000" stroke-width="2"/>
    <text x="915" y="466" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">END</text>
    <text x="915" y="484" text-anchor="middle" font-size="11" fill="#bbb">完成输出</text>
  </g>

  <!-- ============ 主线（状态显式传递）============ -->
  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="240" y1="95" x2="296" y2="95"/>
    <line x1="510" y1="95" x2="566" y2="95"/>
    <line x1="780" y1="95" x2="836" y2="95"/>
    <!-- planner -> retriever (down) -->
    <path d="M950,126 L950,215"/>
    <!-- retriever -> generator_cluster (left) -->
    <line x1="840" y1="277" x2="780" y2="277"/>
    <line x1="570" y1="277" x2="510" y2="277"/>
    <line x1="300" y1="277" x2="240" y2="277"/>
    <!-- critic -> evidence_check (down) -->
    <path d="M140,308 L140,397"/>
    <!-- evidence_check -> quality_gate -> path_planner -> END -->
    <line x1="240" y1="459" x2="296" y2="459"/>
    <line x1="510" y1="459" x2="566" y2="459"/>
    <line x1="780" y1="459" x2="836" y2="459"/>
  </g>
  <text x="268" y="88" font-size="10" fill="#888">状态</text>
  <text x="538" y="270" font-size="10" fill="#888">状态</text>
  <text x="268" y="452" font-size="10" fill="#888">状态</text>

  <!-- ============ 回路（循环回退，虚线）============ -->
  <g stroke="#d97706" stroke-width="2" stroke-dasharray="7,5" fill="none" marker-end="url(#ahd)">
    <!-- retriever -> planner (right side up) -->
    <path d="M1050,277 L1050,95"/>
    <!-- critic -> retriever (bottom curve) -->
    <path d="M135,312 C135,365 945,365 945,312"/>
    <!-- quality_gate -> generator_cluster (up-left) -->
    <path d="M405,428 C405,360 675,360 675,308"/>
  </g>
  <text x="1058" y="190" font-size="11" fill="#b45309">未命中重试</text>
  <text x="470" y="382" font-size="11" fill="#b45309">需改进 · 重新检索</text>
  <text x="470" y="352" font-size="11" fill="#b45309">FIX · 重新生成</text>

  <!-- ============ 图例 ============ -->
  <g font-size="12" fill="#333">
    <rect x="30" y="524" width="22" height="14" rx="3" fill="#f4f1ff" stroke="#7c6af2" stroke-width="2"/>
    <text x="60" y="535">普通角色节点</text>
    <rect x="170" y="524" width="22" height="14" rx="3" fill="#e6f7f4" stroke="#0f9d8e" stroke-width="2.5"/>
    <text x="200" y="535">证据校验 / 验收闸门（留痕·硬性阻断）</text>
    <line x1="430" y1="531" x2="462" y2="531" stroke="#444" stroke-width="2" marker-end="url(#ah)"/>
    <text x="470" y="535">状态显式传递</text>
    <line x1="600" y1="531" x2="632" y2="531" stroke="#d97706" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ahd)"/>
    <text x="640" y="535">循环回退</text>
  </g>
</svg>
