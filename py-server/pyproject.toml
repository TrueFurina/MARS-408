[project]
name = "mars-408-server"
version = "0.1.0"
description = "MARS-408 - 基于 GOMARL 与 FrugalRAG 的 408 考研个性化学习多智能体系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "filelock>=3.13.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.0",
    "langchain-core>=1.4.0",
    "matplotlib>=3.11.0",
    "mcp[cli]>=1.28.0",
    # MeloTTS 不入硬依赖：PyPI 上游 sdist 缺 requirements.txt，pip/uv 构建必失败（CI 事故根因之一）。
    # TTS 走懒加载：services/tts_service.py 里 import 失败自动回退讯飞 TTS API，运行时零影响。
    "numpy>=2.4.6",
    "pymilvus>=2.4.0,<3",  # INC-04：严格匹配 docker 镜像 milvusdb/milvus:v2.4.17（客户端 2.4.x）；3.x 有破坏性 API 变更，禁用
    "pymupdf>=1.27.2.3",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "redis>=5.0.0",
    "sentence-transformers>=3.0.0",
    "sse-starlette>=3.0.0",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
# B1: 测试专属依赖组。CI 用 `pip install -e ".[test]"` 安装，
# 引入 pytest-timeout / pytest-cov（原 dependencies 的 pytest/pytest-asyncio 保持不变）。
test = ["pytest>=8.0.0","pytest-asyncio>=0.23.0","pytest-timeout>=2.2.0","pytest-cov>=5.0.0","respx>=0.21.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# wave-1 默认集：排除需真实向量/模型/慢速用例。各 CI 分档用自身 -m 覆盖本项。
# Windows 默认 pytest 即以此过滤，避免触碰原生 torch/numpy（segv_env 已在 win32 自动 skip）。
# T4：在 wave-1 默认排除（system/requires_milvus/slow）基础上追加全局超时；
# --timeout-method=thread 对 asyncio 用例安全；Linux CI 默认档仍会跑 segv_env（不在此排除）。
# INC-pytest: tests/crypto_platform 是 vendored 的第三方项目副本，其内嵌套
# py-server/tests/conftest.py 与根 tests/conftest.py 撞名（tests.conftest），
# 导致收集阶段 ImportPathMismatchError 全盘中止。显式忽略该副本。
# D3（技术债 P0）：覆盖率门禁强制生效——每次 pytest 都收集覆盖率并按 [tool.coverage.report].fail_under 阻断退化。
# 必须用单个 `--cov=.`（而非裸 `--cov` 或多 `--cov=<pkg>` 列表）：
#   - 裸 `--cov`(无值) 会把紧跟的 `--cov-report=...` 误吞作 cov 目标值，触发 Windows
#     numpy/torch "cannot load module more than once per process" 导入竞态（全量多文件收集必现）；
#   - 多个 `--cov=<pkg>` 同样会在多文件收集时触发该竞态；
#   - 单个 `--cov=.` 经实测全量 915 用例稳定运行，不触发竞态。故采用之。
addopts = ["-m", "not system and not requires_milvus and not slow", "--ignore=tests/crypto_platform", "--cov=.", "--cov-report=term-missing"]
markers = [
    "import_queue: 导入队列单写者保证与任务生命周期测试 (ADR-007)",
    "unit: 单元测试（最快，纯逻辑，无进程/无网络）",
    "integration: 集成测试（真实 InMemoryVectorStore + worker 单例，进程内）",
    "e2e: 端到端测试（TestClient 全链路，lifespan 拉起 worker）",
    "system: 系统测试（起真实 uvicorn 子进程，进程级并发，CI 单独分档 --timeout=180）",
    "requires_milvus: 需要真实 Milvus（pymilvus + 服务端）的测试，CI 默认跳过",
    "segv_env: 在 Windows 原生 torch/numpy 下触发 SIGSEGV 的测试（仅 CI/干净环境运行，本地自动跳过）",
    "slow: 慢速测试（nightly 运行，CI 默认 addopts 跳过）",
    "p0_regression: P0 回归门禁用例（wave-1 最先跑，必须全绿）",
    "review_capture: 判据A 泛化集 capture 门禁（analytic 最优档，必须 ≥99%，CI 独立分档）",
]

[tool.coverage.run]
# D3（技术债 P0）：覆盖率门禁。source 保持 ["."]（与命令行 `--cov=.` 一致，避免覆盖冲突）。
# 注：原注释称 cov-fail-under=80 系误导——此前从未配置真正门槛，本次补齐。
# 实测全量覆盖率 55.68%（wave-1 默认集 915 passed / 207 skipped，2026-09-23），
# 含 root CLI 脚本（train_*/import_*/seed_*/start_*/export_onnx 等不可单测入口）拉低分母。
source = ["."]
omit = ["tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
# 门槛 = 实测全量覆盖(55.68%) 下浮 ~2pp，锁定当前覆盖、阻断显著退化。
# 80 为愿景目标，待 D8（补 Top5 模块单测）按 ratchet 逐步抬升；每次抬升须以新增测试支撑、不得凭空上调。
fail_under = 54
show_missing = true
skip_covered = false

[tool.ruff]
# D11（技术债 P1）：F401 门禁配套配置。
# 仅启用 F401（未使用导入）——单一目标，不引入其它 lint 规则干扰既有代码风格（零行为改动原则）。
# ruff 默认尊重 .gitignore，自动跳过 crypto_platform 等 vendored 副本；per-file-ignores 再兜底一层。
line-length = 100
target-version = "py312"
respect-gitignore = true

[tool.ruff.lint]
select = ["F401"]

[tool.ruff.lint.per-file-ignores]
# 第三方 vendored 副本：即便被强制暂存也不扫描（与 setuptools packages.find exclude 一致）。
"**/crypto_platform/**" = ["F401"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "api*", "config*", "data*", "db*", "engines*", "experiments*", "schemas*", "services*", "sessions*", "shared*", "tools*", "utils*"]
# D1（技术债 P0）：排除 vendored 的 408 整份嵌套副本 crypto_platform（188 文件），
# 否则 packages.find 的 "agents*" 等通配会把 agents/crypto_platform 等打进 wheel。
# 该副本已由 .gitignore 的 crypto_platform/ 排除入库，此处补齐打包侧隔离（仅隔离，不删除）。
exclude = ["*crypto_platform*"]
