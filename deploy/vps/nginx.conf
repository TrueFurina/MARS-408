# ============================================================
# 芒得很职 · 职业素养对抗实训 —— nginx 站点配置（单机全栈部署）
#
# 放置：/etc/nginx/sites-available/career-pilot
#       sudo ln -s /etc/nginx/sites-available/career-pilot /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# ── 关键设计：为什么只反代、不另做静态托管 ─────────────────────
# 后端**已经**单端口同源托管前端 SPA（`app/static_sites.py:install_spa()`：
# 挂 /assets，并对非 /api 的 404 GET/HEAD 回退到 index.html）。
# 因此 nginx 只需把**整站**转发给后端即可 —— 不要再让 nginx 自己去托管
# `backend/site/`，否则两处都管前端会产生「谁先匹配」的诡异行为
# （典型症状：能打开首页但子路由 404，或资源 404）。
# ============================================================

server {
    listen 80;
    # 试用期用 IP:80 直连即可；备案/域名到位后再换 server_name 并上 443。
    server_name _;

    # 与后端中间件上限对齐：`app/middleware.MAX_REQUEST_BYTES` 默认 50MB。
    # 这里必须 >= 它，否则请求会先被 nginx 用 413 拦掉，后端根本没机会响应。
    client_max_body_size 50m;

    # 大文件上传/长报告生成时给足超时（后端有单次生成较慢的端点）
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ── SSE 流式：本项目大量使用 Server-Sent Events（对话/推流/进度）──
    # 必须关闭缓冲，否则 nginx 会攒够一批才吐给浏览器，
    # 表现为「逐字输出变成一次性蹦出来」或干脆卡住。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection        '';
        proxy_buffering   off;
        proxy_cache       off;
        proxy_read_timeout 3600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 其余全部（SPA 路由 / assets / plots / media / showcase）交给后端 ──
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 刻意不开 gzip ──
    # 后端已装 `GZipMiddleware`（>=1KB 响应自动压缩）；nginx 再压一遍是重复劳动，
    # 还可能对已压缩内容二次压缩反而变大。保持关闭。
    gzip off;

    # 探活示例（GET 或 HEAD 均可 —— 后端已补齐 HEAD）：
    #   curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1/api/status
}

# ── 后续上 HTTPS（试用期之后再办，非试用前置）──────────────────
# 1) 域名解析到本机；2) sudo certbot --nginx -d <域名>
# 3) 后端在 production 下已自动下发 HSTS 与严格 CSP，certbot 只改 nginx 侧
#    （见 `app/middleware.py` 的 security_headers 与 _install_cors）。
#    注意：CORS 在 production 下**只认显式白名单**；同源部署无需配置，
#    若要让外部域跨域访问，需在 .env 设 CORS_ALLOW_ORIGINS=https://<域名>。
